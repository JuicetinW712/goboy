<!doctype html>
<style>
  canvas {
    width: 100%;
    height: auto;
  }
</style>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("goboy.wasm"), go.importObject).then(
    (result) => {
      go.run(result.instance);
    },
  );
</script>
